<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office Avontuur</title>
<style>
:root{--acc:#8e3b8e;--acc2:#c25fa8;--accl:#f6e8f3;--bg:#f7f4f8;--card:#fff;--ink:#222;--muted:#666;--ok:#1f8a4c;--bad:#c62828;--word:#2b579a;--line:#e1dfdd}
body[data-theme="oceaan"]{--acc:#0e6e8c;--acc2:#1fa2c4;--accl:#e3f4f9;--bg:#f2f8fa}
body[data-theme="bos"]{--acc:#2f7a4a;--acc2:#4fa66b;--accl:#e6f4ea;--bg:#f3f8f4}
body[data-theme="goud"]{--acc:#a06a12;--acc2:#d39b2a;--accl:#fbf1dc;--bg:#fbf8f1}
body[data-theme="nacht"]{--acc:#7c6cf0;--acc2:#a796ff;--accl:#2c2a45;--bg:#17162a;--card:#232238;--ink:#eee;--muted:#aaa;--line:#3a3955}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Calibri,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
button{font-family:inherit;font-size:inherit;cursor:pointer}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--accl);color:var(--acc)}
.btn.ghost{background:transparent;color:var(--acc);border:2px solid var(--acc)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.hidden{display:none!important}
/* top bar */
#top{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--acc);color:#fff;position:sticky;top:0;z-index:50;flex-wrap:wrap}
#top .logo{font-weight:800;font-size:20px;display:flex;align-items:center;gap:8px;cursor:pointer}
#top .logo svg{width:30px;height:30px}
#top .sp{flex:1}
.chip{background:rgba(255,255,255,.18);border-radius:20px;padding:6px 12px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip button{background:none;border:0;color:#fff;font-weight:600;padding:0}
.xpbar{width:70px;height:8px;background:rgba(255,255,255,.3);border-radius:5px;overflow:hidden}
.xpbar i{display:block;height:100%;background:#ffd54a}
#top .tb{background:#fff;color:var(--acc);border:0;border-radius:20px;padding:6px 11px;font-weight:700;white-space:nowrap}
#top .chip{padding:5px 10px}
main{max-width:none;margin:0;padding:14px 16px}
.login,.theory{max-width:1400px;margin-left:auto;margin-right:auto}
/* login */
.login{max-width:520px;margin:40px auto;background:var(--card);border-radius:18px;padding:30px;box-shadow:0 6px 30px rgba(0,0,0,.08)}
.login h1{margin:0 0 6px;color:var(--acc)}
.login label{display:block;font-weight:600;margin:16px 0 6px}
.login input{width:100%;padding:12px;font-size:17px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.prof{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.prof button{background:var(--accl);color:var(--acc);border:0;border-radius:10px;padding:10px 14px;font-weight:600}
/* home */
.hero{display:flex;gap:20px;align-items:center;background:var(--card);border-radius:18px;padding:20px 24px;margin-bottom:20px}
.hero h2{margin:0 0 4px}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.lv{background:var(--card);border-radius:18px;padding:20px;box-shadow:0 3px 14px rgba(0,0,0,.06);cursor:pointer;border:3px solid transparent;transition:.15s;position:relative}
.lv:hover{border-color:var(--acc2);transform:translateY(-2px)}
.lv.locked{opacity:.55;cursor:not-allowed}
.lv.locked:hover{transform:none;border-color:transparent}
.lv .ic{width:54px;height:54px;border-radius:14px;background:var(--accl);display:flex;align-items:center;justify-content:center;font-size:28px}
.lv h3{margin:12px 0 4px}
.lv p{margin:0 0 12px;color:var(--muted);font-size:14px}
.prog{height:10px;background:var(--accl);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc2)}
.stars{font-size:22px;letter-spacing:2px;margin-top:8px}
.stars .off{opacity:.2}
.lock{position:absolute;top:16px;right:16px;font-size:22px}
/* level */
.lvwrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px;transition:grid-template-columns .2s}
.lvwrap.collapsed{grid-template-columns:58px minmax(0,1fr)}
.sidetop{display:flex;gap:6px;margin-bottom:8px}
.sidetop #back{flex:1}
#sideTog{flex:none;width:40px;height:40px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-size:18px;font-weight:700;cursor:pointer}
.collapsed .side{padding:8px 6px}
.collapsed .side .lbl,.collapsed .side h3,.collapsed .side .sidepts{display:none}
.collapsed .sidetop{flex-direction:column;align-items:center}
.collapsed .sidetop #back,.collapsed #sideTh{width:40px!important;height:40px;padding:0;flex:none}
.collapsed #sideTh{display:block;margin:0 auto 8px}
.collapsed .side .it{justify-content:center;padding:5px 0}
.panel,.wapp{min-width:0}
.side{background:var(--card);border-radius:16px;padding:14px;align-self:start;position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}
.side h3{margin:4px 6px 10px;font-size:17px}
.side .it{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;cursor:pointer;font-size:14px}
.side .it:hover{background:var(--accl)}
.side .it.cur{background:var(--acc);color:#fff}
.dot{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--line);color:#555}
.dot.ok{background:var(--ok);color:#fff}.dot.skip{background:#f0a500;color:#fff}
.it.cur .dot{box-shadow:0 0 0 2px #fff}
.panel{background:var(--card);border-radius:16px;padding:18px 20px}
.qtype{display:inline-block;font-size:13px;font-weight:700;color:var(--acc);background:var(--accl);padding:4px 10px;border-radius:20px;margin-bottom:8px}
.panel h2{margin:4px 0 14px;font-size:22px}
.fb{margin:14px 0;padding:12px 16px;border-radius:12px;font-weight:600}
.fb.ok{background:#e4f5ea;color:var(--ok)}.fb.bad{background:#fde8e8;color:var(--bad)}.fb.info{background:var(--accl);color:var(--acc)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.opt{text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:14px;font-size:17px;display:flex;gap:10px;align-items:center}
.opt:hover:not(:disabled){border-color:var(--acc2)}
.opt b{background:var(--accl);color:var(--acc);border-radius:8px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex:none}
.opt.wrong{border-color:var(--bad);background:#fde8e8;color:#999}
.opt.right{border-color:var(--ok);background:#e4f5ea}
.hints{margin-top:18px;border-top:2px dashed var(--line);padding-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hints .lbl{font-weight:700;color:var(--muted);margin-right:4px}
.hintbox{background:#fff8e1;color:#6d4c00;border-left:5px solid #f0b400;padding:10px 14px;border-radius:8px;margin-top:10px}
.navrow{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.instr{background:var(--accl);border-radius:12px;padding:12px 16px 12px 36px;margin:0 0 12px}
.instr li{margin:4px 0}
.instr li.ok{color:var(--ok)}.instr li.ok::marker{content:"✔ "}
.instr li.bad{color:var(--bad)}.instr li.bad::marker{content:"✘ "}
/* ===== Word ribbon ===== */
.wapp{border:1px solid #c8c6c4;border-radius:8px;overflow:hidden;background:#fff;color:#222;font-family:"Segoe UI",Arial,sans-serif;font-size:13px;user-select:none}
.wtitle{background:#185abd;color:#fff;height:42px;padding:0 8px;font-size:13px;display:flex;align-items:center;gap:10px}
.wtitle button{font-family:inherit;color:#fff}
.wlogo{width:22px;height:22px;background:#fff;color:#185abd;border-radius:4px;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.wtl{display:flex;align-items:center;gap:2px;flex:none}
.as{background:none;border:0;display:flex;align-items:center;gap:6px;font-size:12px;padding:4px 6px;border-radius:4px}
.as:hover,.qa:hover,.fname:hover,.wc3:hover{background:rgba(255,255,255,.18)}
.wsw{width:30px;height:16px;border:1.5px solid #fff;border-radius:9px;position:relative;display:inline-block;flex:none}
.wsw i{position:absolute;top:2px;left:2px;width:9px;height:9px;border-radius:50%;background:#fff;transition:.15s}
.wsw.on{background:#fff}.wsw.on i{left:16px;background:#185abd}
.qa{background:none;border:0;width:28px;height:28px;border-radius:4px;font-size:17px;display:flex;align-items:center;justify-content:center;padding:0}
.qa svg{width:16px;height:16px}
.fname{background:none;border:0;font-size:13px;padding:5px 8px;border-radius:4px;display:flex;align-items:center;gap:2px;white-space:nowrap;flex:none;max-width:40%;overflow:hidden}
.fname .fn{font-weight:600}.fst{opacity:.9;font-size:12px}.fdd{margin-left:4px;font-size:14px}
.wsearch{background:rgba(255,255,255,.9)!important;color:#444!important;border:0;border-radius:5px;height:28px;flex:0 1 360px;margin:0 auto;text-align:left;padding:0 10px;font-size:12px;min-width:90px;overflow:hidden;white-space:nowrap}
.wtr{display:flex;align-items:center;gap:6px;flex:none}
.wav{width:26px;height:26px;border-radius:50%;background:#c43e8a;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-right:6px}
.wc3{width:34px;text-align:center;line-height:28px;border-radius:3px}
.tsp{flex:1}
.wtab2{background:#fff;border:1px solid #c8c6c4;border-radius:4px;margin:4px 2px;padding:2px 10px;font-size:12px;color:#333}
.wshare{background:#185abd;color:#fff;border:0;border-radius:4px;margin:4px 6px 4px 4px;padding:2px 14px;font-size:12px;font-weight:600}
.c1 .lbl2{display:none}.wtab2,.wshare{flex:none;white-space:nowrap}
.wtab2:hover{background:#e1dfdd}.wshare:hover{background:#124a9c}
.wgrp .gn{position:relative;padding-right:12px!important;padding-left:12px!important}
.dlg{position:absolute;right:0;bottom:3px;border:0;background:none;padding:1px 2px;cursor:pointer;line-height:0;border-radius:2px}
.dlg:hover{background:#e1dfdd}
.ren{padding:6px 8px;min-width:300px}
.ren input{width:100%;font-size:14px;padding:7px 8px;border:2px solid #185abd;border-radius:4px;margin:4px 0;font-family:"Segoe UI",Arial,sans-serif}
.renerr{color:#c62828;font-size:12px;min-height:16px}
.renloc{font-size:12px;color:#555;margin:2px 0 8px}
.renbtns{text-align:right}.renbtns .btn{background:#185abd;padding:6px 16px;font-size:13px}
.wstatus .wsp{flex:1}.wstatus .zl{display:inline-block;width:90px;height:2px;background:#888;vertical-align:middle;position:relative;margin:0 4px}.wstatus .zl b{position:absolute;left:43px;top:-5px;width:4px;height:12px;background:#444;border-radius:1px}
.wtabs{display:flex;background:#f3f2f1;padding:0 6px;border-bottom:1px solid #e1dfdd;flex-wrap:nowrap;align-items:center;overflow:hidden}
.wtab{white-space:nowrap;flex:none;padding:7px 10px 6px;border:0;background:none;font-size:13px;color:#333;border-bottom:3px solid transparent}
.wtab:hover{background:#e1dfdd}
.wtab.on{border-bottom-color:var(--word);color:var(--word);font-weight:600;background:#fff}
.wtab.file{background:none;color:#333}
.wtab.file.on{color:var(--word)}
.wtab.ctx{color:#7a3b8f}.wtab.ctx.on{border-bottom-color:#7a3b8f}
.wtab.pulse{animation:pulse 1s infinite;background:#ffe9a8}
@keyframes pulse{50%{background:#ffd34d}}
.wribbon{display:flex;align-items:stretch;padding:4px 4px 0;min-height:100px;background:#fff;overflow-x:auto}
.wgrp{display:flex;flex-direction:column;border-right:1px solid #e1dfdd;padding:0 5px;flex:none}
.wgrp .gi{display:flex;align-items:flex-start;gap:2px;flex:1}
.wgrp .gn{text-align:center;font-size:11px;color:#666;padding:2px 0 4px;white-space:nowrap}
.rb{background:none;border:1px solid transparent;border-radius:3px;color:#222;display:flex;align-items:center;justify-content:center;gap:3px;padding:2px 4px;font-size:12px;position:relative}
.rb:hover{background:#e1dfdd;border-color:#c8c6c4}
.rb.L{flex-direction:column;width:auto;min-width:50px;height:72px;padding:4px 4px;white-space:normal;text-align:center;line-height:1.15}
.rb.L svg{width:32px;height:32px;margin-bottom:2px}
.rb.S svg{width:17px;height:17px}
.rb.S{height:26px;min-width:26px}
.rb.SL{justify-content:flex-start;height:24px;white-space:nowrap}
.rb.SL svg{width:16px;height:16px}
.rb .g{font-size:15px;line-height:1;min-width:16px;text-align:center}
.rb .dd{font-size:8px;color:#555}
.rb.on{background:#c7e0f4;border-color:#9ec5e8}
.rows{display:flex;flex-direction:column;gap:3px;padding-top:2px}
.rows .r{display:flex;gap:1px;align-items:center}
.col{display:flex;flex-direction:column;gap:1px;padding-top:2px}
.rb-sel{height:24px;border:1px solid #c8c6c4;border-radius:2px;font-size:12px;background:#fff;color:#222;padding:0 2px}
.fsel{height:24px;white-space:nowrap;overflow:hidden;border:1px solid #c8c6c4;border-radius:2px;font-size:12px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 4px;color:#222}
.fsel:hover{border-color:var(--word)}
.stylebox{display:flex;gap:3px;border:1px solid #e1dfdd;padding:3px;height:62px;margin-top:2px;background:#fff}
.stylebox .rb{width:96px;height:54px;justify-content:flex-start;padding:2px 8px;background:#fff;border:1px solid #eee;white-space:nowrap;overflow:hidden}
.stylebox .rb span.s{font-size:11px;color:#444}
.stylebox .rb span.p{font-size:15px}
.flash-ok{animation:fok .8s}
@keyframes fok{0%,60%{background:#b6e8c6;border-color:var(--ok)}}
.flash-bad{animation:fbad .6s}
@keyframes fbad{0%,60%{background:#f8c4c4;border-color:var(--bad)}}
/* document area */
.wdoc{background:#e9e9e9;padding:18px;overflow:auto;height:calc(100vh - 420px);min-height:300px}
.wapp:not(:has(.edrow)) .wdoc{height:auto}
.page{background:#fff;margin:0 auto;box-shadow:0 1px 6px rgba(0,0,0,.25);position:relative;display:flex;flex-direction:column;width:620px;min-height:780px;--mt:62px;--ms:62px;transition:width .3s,min-height .3s;color:#000}
.page[data-or="liggend"]{width:860px;min-height:560px}
.page[data-m="smal"]{--mt:32px;--ms:32px}
.page[data-m="breed"]{--mt:62px;--ms:120px}
.page[data-m="gemiddeld"]{--mt:62px;--ms:46px}
.page[data-border="1"]::after{content:"";position:absolute;inset:16px;border:3px double #444;pointer-events:none}
.hdr,.ftr{min-height:var(--mt);padding:14px var(--ms) 6px;font-family:Aptos,Calibri,Arial,sans-serif;font-size:12pt;outline:none;color:#000}
.ftr{padding:6px var(--ms) 14px;display:flex;align-items:flex-end}
.hdr.active,.ftr.active{border-bottom:1px dashed #2b579a;background:rgba(43,87,154,.04)}
.ftr.active{border-bottom:0;border-top:1px dashed #2b579a}
.hdr.active:empty::before,.ftr.active:empty::before{content:"[Hier typen]";color:#999}
.pagenr{display:inline-block;margin-left:auto}
.ftr .pagenr{margin:0 auto}
.wbody{flex:1;padding:0 var(--ms);outline:none;font-family:Aptos,Calibri,"Segoe UI",Arial,sans-serif;font-size:12pt;line-height:1.15;color:#000;user-select:text;cursor:text}
.wbody p{margin:0 0 8pt}
.wbody h1{font-family:"Aptos Display",Aptos,Calibri,Arial,sans-serif;font-size:20pt;color:#0f4761;font-weight:normal;margin:18pt 0 4pt}
.wbody h2{font-family:"Aptos Display",Aptos,Calibri,Arial,sans-serif;font-size:16pt;color:#0f4761;font-weight:normal;margin:8pt 0 4pt}
.wbody ul,.wbody ol{margin:0 0 8pt;padding-left:36px}
.wbody table{border-collapse:collapse;width:100%;margin:0 0 8pt}
.wbody td{border:1px solid #000;padding:2px 6px;height:20px;vertical-align:top}
.wbody img{max-width:100%;cursor:pointer}
.wbody img.sel{outline:2px solid #2b579a;outline-offset:2px}
.wbody img[data-wrap="vierkant"],.wbody img[data-wrap="strak"]{float:left;margin:2px 14px 6px 0}
.wbody img[data-wrap="bovenonder"]{display:block;margin:6px 0}
.marks .wbody p::after,.marks .wbody h1::after,.marks .wbody h2::after,.marks .wbody li::after{content:"¶";color:#2b579a;margin-left:2px}
.wstatus{background:#f3f2f1;border-top:1px solid #e1dfdd;padding:3px 10px;font-size:12px;color:#555;display:flex;gap:16px}
/* menus */
.menu{position:fixed;z-index:200;background:#fff;color:#222;border:1px solid #c8c6c4;box-shadow:0 6px 18px rgba(0,0,0,.18);border-radius:4px;padding:6px;font-size:13px;min-width:150px}
.menu .mi{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:3px;cursor:pointer;white-space:nowrap}
.menu .mi:hover{background:#e1dfdd}
.menu .mh{font-weight:600;font-size:12px;color:#555;padding:4px 6px}
.pal{display:grid;grid-template-columns:repeat(10,18px);gap:3px;padding:4px}
.pal span{width:18px;height:18px;border:1px solid #bbb;cursor:pointer;display:block}
.pal span:hover{outline:2px solid #e38b00}
.grid{display:grid;grid-template-columns:repeat(8,18px);gap:2px;padding:4px}
.grid span{width:18px;height:18px;border:1px solid #aaa;display:block;cursor:pointer}
.grid span.h{background:#fbd7a6;border-color:#e38b00}
.gal{display:grid;grid-template-columns:repeat(3,96px);gap:8px;padding:6px}
.gal div{border:1px solid #ddd;border-radius:4px;text-align:center;padding:4px;cursor:pointer;font-size:12px}
.gal div:hover{border-color:#2b579a;background:#eef4fb}
.gal img{width:80px;height:80px}
/* modal & toast */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:300;padding:20px}
.modal{background:var(--card);color:var(--ink);border-radius:20px;padding:26px;max-width:640px;width:100%;max-height:88vh;overflow:auto;text-align:center;animation:pop .25s}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.modal h2{margin-top:0;color:var(--acc);padding:0 40px}
.modal{position:relative}
.mx{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:var(--accl);color:var(--ink);font-size:20px;font-weight:700;line-height:1;cursor:pointer}
.mx:hover{background:var(--acc);color:#fff}
.ranks{display:flex;flex-direction:column;gap:8px;text-align:left}
.rk{display:flex;align-items:center;gap:14px;border:2px solid var(--line);border-radius:14px;padding:10px 14px;opacity:.7}
.rk.done{opacity:1;border-color:var(--ok)}.rk.now{opacity:1;border-color:var(--acc);background:var(--accl);box-shadow:0 0 0 3px var(--acc2) inset}
.rk .re{font-size:32px}.rk .rn{flex:1;display:flex;flex-direction:column}.rk .rn small{color:var(--muted)}.rk .rs{font-weight:600;white-space:nowrap}
.lvtag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--acc2);color:#fff;margin-left:6px;vertical-align:middle}
.big{font-size:64px;line-height:1.1}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 20px;border-radius:12px;z-index:400;font-weight:600;max-width:90vw;text-align:center}
.coinfly{position:fixed;z-index:500;font-weight:800;color:#e0a800;font-size:24px;pointer-events:none;animation:fly 1.2s forwards;text-shadow:0 1px 0 #fff}
@keyframes fly{to{transform:translateY(-80px);opacity:0}}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;text-align:center;margin-top:10px}
.bdg{background:var(--accl);border-radius:14px;padding:12px}
.bdg .e{font-size:38px}
.bdg.off{filter:grayscale(1);opacity:.6}
.bdg b{display:block;margin:4px 0 2px}
.bdg small{color:var(--muted)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:10px}
.shop .itm{border:2px solid var(--line);border-radius:14px;padding:12px}
.sw{height:40px;border-radius:10px;margin-bottom:8px}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:350;animation:fall 2.4s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
/* leesbaarheid */

 {id:"L2e5",type:"editor",short:"Lege alinea's",title:"Ruim de lege alinea's op",
  html:"<p>Menu van de week</p><p><br></p><p><br></p><p>Maandag: spaghetti</p><p><br></p><p>Dinsdag: soep met brood</p><p><br></p><p><br></p><p>Woensdag: frietjes</p><p>Donderdag: kip met rijst</p><p><br></p>",
  steps:["Klik op <b>¶ Alles weergeven</b> (Start › Alinea). Nu zie je de verborgen tekens.","Verwijder alle <b>lege alinea's</b>. Een lege alinea is een regel met alleen <span class='sym'><i>¶</i></span>.","Zet de 4 dagen in een lijst met <b>opsommingstekens</b>.","Alle tekst blijft staan."],

  hint1:"Klik vooraan op een lege regel (met alleen ¶) en druk op Backspace ⌫.",hint2:"Klik in de lege regel en druk op <b>Backspace ⌫</b>. Doe dat voor elke ¶ zonder tekst. Selecteer daarna de 4 dagen en klik op de knop met de <b>bolletjes</b>."},
 {id:"L2e3",type:"editor",short:"Klasregels",title:"Maak de regels van de computerklas overzichtelijk",
  html:"<p>Regels in de computerklas</p><p>Wij vragen aan iedereen:</p><p>Eet en drink niet aan de computer.</p><p>Meld je af als je stopt.</p><p>Zet je gsm op stil.</p><p>Bedankt om mee op te letten!</p>",
  steps:["Geef de titel de stijl <b>Kop 2</b>.","Zet de 3 regels (Eet en drink ... gsm op stil) in een lijst met <b>opsommingstekens</b>.","Laat die lijst één keer <b>inspringen</b> (naar rechts).","<b>Centreer</b> de laatste zin en maak hem <b>cursief</b>."],
  checks:[t=>t.tag("Regels in de computerklas","H2"),t=>t.inList("ul",["Eet en drink","Meld je af","Zet je gsm"]),t=>t.indented("Eet en drink"),t=>t.align("Bedankt om mee op te letten!","center")&&t.style("Bedankt om mee op te letten!",t.isItalic)],

 {id:"L2e4",type:"editor",short:"Folder",title:"Werk de folder over gezond ontbijten af",
  html:"<p>Gezond ontbijten</p><p>Een goed ontbijt geeft je energie voor de hele dag. Wie ontbijt, kan zich op school beter concentreren. Kies elke ochtend iets uit deze drie groepen.</p><p>Volkorenbrood</p><p>Fruit</p><p>Melk of yoghurt</p><p>Tip: drink elke dag genoeg water.</p>",
  steps:["Geef de titel de stijl <b>Kop 1</b> en <b>centreer</b> hem.","<b>Vul</b> de tekst 'Een goed ontbijt ...' <b>uit</b> en geef hem regelafstand <b>2,0</b>.","Maak van Volkorenbrood, Fruit en Melk of yoghurt een <b>genummerde lijst</b>.","Maak alleen het woord <b>Tip:</b> vet.","Klik bovenaan in de blauwe balk op de bestandsnaam en geef het bestand de naam <b>Folder ontbijt</b>."],
  checks:[t=>t.tag("Gezond ontbijten","H1")&&t.align("Gezond ontbijten","center"),t=>t.align("Een goed ontbijt","justify")&&t.spacing("Een goed ontbijt",2),t=>t.inList("ol",["Volkorenbrood","Fruit","Melk of yoghurt"]),t=>t.style("Tip:",t.isBold)&&t.style("drink elke dag",t.not(t.isBold)),t=>t.fileName("Folder ontbijt")],
  hint1:"Werk stap per stap. Je hebt maar 2 gratis controles!",hint2:"Uitvullen = knop met 4 even lange lijntjes. Regelafstand = blauwe pijl → 2,0. Dubbelklik op 'Tip' en sleep tot aan de dubbele punt om alleen 'Tip:' te selecteren."}
]},

/* ================= LEVEL 5 — MIX: brieven en documenten (level 1 + 2 + 4) ================= */
{id:"L5",title:"Mix: brieven en verslagen",emoji:"✉️",intro:"Je combineert tekstopmaak, alinea's en pagina-indeling in echte documenten.",mix:true,ex:[
 {id:"L5r1",type:"ribbon",short:"Voettekst",q:"Onderaan <b>elke pagina</b> van je verslag moet 'Vertrouwelijk' staan. Klik op de juiste knop.",target:["invoegen.voettekst"],hint1:"Onderaan elke pagina ... dat heet geen koptekst.",hint2:"Tabblad <b>Invoegen</b> › Koptekst en voettekst › <b>Voettekst</b>."},
 {id:"L5r2",type:"ribbon",short:"Opmaak kopiëren",q:"Je titel is perfect opgemaakt. Je wil <b>dezelfde opmaak</b> in één klik op een andere titel zetten.",target:["start.opmaakkopieren"],hint1:"Je kopieert niet de tekst, maar de opmaak.",hint2:"Tabblad Start, groep Klembord: het <b>kwastje</b>."},
 {id:"L5q1",type:"quiz",short:"Goede brief",q:"Je schrijft een brief. Welke opmaak is het <b>best leesbaar</b>?",opts:["Vijf verschillende lettertypes en veel kleuren","Eén lettertype, grootte 11 of 12, titels vet","Alles in HOOFDLETTERS","Alle tekst rood en cursief"],ok:1,hint1:"Minder is vaak meer.",hint2:"Rustig en duidelijk: één lettertype.",explain:"Een rustige opmaak leest het best: één lettertype, een gewone grootte en enkel titels of belangrijke woorden vet."},
 {id:"L5q2",type:"quiz",short:"Nieuw hoofdstuk",q:"Je wil een nieuw hoofdstuk op een <b>nieuwe pagina</b> laten beginnen. Wat is de beste manier?",opts:["Op Enter drukken tot je op de volgende pagina bent","Een pagina-einde invoegen (Ctrl + Enter)","Een nieuw document maken","De marges groter maken"],ok:1,hint1:"Als je later tekst toevoegt, mag het hoofdstuk niet verschuiven.",hint2:"Je leerde dit in level 3.",explain:"Met een pagina-einde begint de tekst altijd op een nieuwe pagina, ook als je later tekst toevoegt."},
 {id:"L5k1",type:"keys",short:"Pagina-einde",q:"Voeg met een sneltoets een <b>pagina-einde</b> in.",combo:"Ctrl+Enter",hint1:"Ctrl + een grote toets rechts op je toetsenbord.",hint2:"Ctrl + <b>Enter</b>."},
 {id:"L5e1",type:"editor",short:"Uitnodiging",title:"Maak de uitnodiging voor het oudercontact af",
  html:"<p>Uitnodiging oudercontact</p><p>Beste ouders,</p><p>Op donderdag 12 december om 18 uur organiseren we een oudercontact. U kan dan met alle leerkrachten praten over de resultaten van uw kind. Inschrijven kan via de website van de school.</p><p>Met vriendelijke groeten</p><p>De klastitularis</p>",
  steps:["Geef de titel de stijl <b>Kop 1</b> en <b>centreer</b> hem.","Maak alleen de woorden <b>donderdag 12 december om 18 uur</b> vet.","<b>Vul</b> de alinea 'Op donderdag ...' <b>uit</b>.","Lijn <b>Met vriendelijke groeten</b> en <b>De klastitularis</b> rechts uit.","Voeg een <b>koptekst</b> in met de tekst <b>School Zonnedal</b>.","Geef het bestand de naam <b>Uitnodiging_{voornaam}</b> (met een liggend streepje _)."],
  checks:[t=>t.tag("Uitnodiging oudercontact","H1")&&t.align("Uitnodiging oudercontact","center"),t=>t.style("donderdag 12 december om 18 uur",t.isBold)&&t.style("organiseren we",t.not(t.isBold))&&t.style("U kan dan",t.not(t.isBold)),t=>t.align("Op donderdag","justify"),t=>t.align("Met vriendelijke groeten","right")&&t.align("De klastitularis","right"),t=>t.header("school zonnedal"),t=>t.fileFirst("Uitnodiging")],
  hint1:"Je kan 2 regels samen rechts uitlijnen: selecteer ze allebei.",hint2:"Sleep precies van 'donderdag' tot 'uur' voor de vetgedrukte woorden. Koptekst = <b>Invoegen › Koptekst</b>."},
 {id:"L5e2",type:"editor",autosave:false,short:"Verslag",title:"Maak een verslag met titels",
  html:"<p>Verslag: onze klasuitstap</p><p>Inleiding</p><p>Op 5 oktober gingen we met de klas naar Brussel. We vertrokken vroeg met de trein en kwamen 's avonds moe maar tevreden terug.</p><p>Wat deden we?</p><p>We bezochten het Atomium</p><p>We aten samen in het park</p><p>We namen de trein terug</p><p>Besluit</p><p>Het was een leuke en leerrijke dag.</p>",
  steps:["Geef de titel <b>Verslag: onze klasuitstap</b> de stijl <b>Kop 1</b>.","Geef <b>Inleiding</b>, <b>Wat deden we?</b> en <b>Besluit</b> de stijl <b>Kop 2</b>.","Zet de 3 activiteiten in een <b>genummerde lijst</b>.","Geef de tekst 'Op 5 oktober ...' regelafstand <b>1,5</b>.","Voeg <b>onderaan</b> een <b>paginanummer</b> toe.","Automatisch opslaan staat hier <b>uit</b>. Sla je werk op het einde zelf op met <b>Ctrl + S</b> (of de knop 💾 linksboven)."],
  checks:[t=>t.tag("Verslag: onze klasuitstap","H1"),t=>["Inleiding","Wat deden we?","Besluit"].every(w=>t.tag(w,"H2")),t=>t.inList("ol",["We bezochten","We aten","We namen"]),t=>t.spacing("Op 5 oktober",1.5),t=>t.pagenr("ftr"),t=>t.saved()],
  hint1:"Geef elke tussentitel apart de stijl Kop 2: klik in de titel en klik op Kop 2.",hint2:"Stijlen = Start › Stijlen. Nummering = knop met 1 2 3. Paginanummer = Invoegen › Paginanummer › Onderaan pagina."},
 {id:"L5r3",type:"ribbon",short:"Spelling",q:"Je wil controleren of er <b>geen schrijffouten</b> in je brief staan. Klik op de juiste knop.",target:["controleren.spelling"],hint1:"Je 'controleert' je tekst.",hint2:"Tabblad <b>Controleren</b>: <b>Spelling en grammatica</b>."},
 {id:"L5r4",type:"ribbon",short:"Woorden tellen",q:"Je verslag moet <b>minstens 200 woorden</b> zijn. Waar zie je hoeveel woorden je al hebt?",target:["controleren.woordentellen"],hint1:"Ook dit vind je bij het nakijken van je tekst.",hint2:"Tabblad <b>Controleren</b>: <b>Woorden tellen</b>."},
 {id:"L5q3",type:"quiz",short:"Kop- en voettekst",q:"Je verslag is 5 pagina's lang. Je wil je <b>naam bovenaan</b> en het <b>paginanummer onderaan</b> elke pagina. Wat doe je?",opts:["Op elke pagina zelf je naam en een nummer typen","Een koptekst met je naam en een paginanummer onderaan invoegen","Je naam in de titel zetten","Vijf aparte documenten maken"],ok:1,hint1:"Word kan dit automatisch op elke pagina zetten.",hint2:"Denk aan level 4.",explain:"In een koptekst en voettekst zet je iets één keer, en Word toont het op elke pagina."},
 {id:"L5q4",type:"quiz",short:"Inhoudsopgave",q:"Je wil dat Word <b>automatisch een inhoudsopgave</b> maakt. Wat moet je eerst doen?",opts:["Alle titels vet en groot maken","Alle titels een Kop-stijl geven (Kop 1, Kop 2)","Alle titels onderstrepen","Alle titels in een tabel zetten"],ok:1,hint1:"Word moet weten welke regels titels zijn.",hint2:"Dat zie je aan de stijl van de titel.",explain:"Word maakt een inhoudsopgave van alle titels met een Kop-stijl."},
 {id:"L5k2",type:"keys",short:"Opnieuw",q:"Je maakte iets ongedaan, maar je wil het toch terug. Druk op de sneltoets voor <b>opnieuw</b>.",combo:"Ctrl+Y",hint1:"Het is níet Ctrl + Z: dat maakt ongedaan.",hint2:"Ctrl + <b>Y</b>."},
 {id:"L5e3",type:"editor",short:"Inschrijfformulier",title:"Maak een inschrijfformulier",
  html:"<p>Inschrijving sportnamiddag</p><p>Naam:</p><p>Klas:</p><p>Datum:</p><p>Kies je activiteit:</p><p>Voetbal</p><p>Dans</p><p>Schaken</p>",
  steps:["Geef de titel grootte <b>18</b>, de kleur <b>Blauw</b> en <b>onderstreep</b> hem.","Maak <b>Naam:</b>, <b>Klas:</b> en <b>Datum:</b> vet.","Zet Voetbal, Dans en Schaken in een lijst met <b>opsommingstekens</b> en laat die lijst <b>inspringen</b>.","Kies de marges <b>Smal</b>."],
  checks:[t=>t.style("Inschrijving sportnamiddag",t.size(18))&&t.style("Inschrijving sportnamiddag",t.color("#0070C0"))&&t.style("Inschrijving sportnamiddag",t.isUnderline),t=>["Naam:","Klas:","Datum:"].every(w=>t.style(w,t.isBold))&&t.style("Kies je activiteit:",t.not(t.isBold)),t=>t.inList("ul",["Voetbal","Dans","Schaken"])&&t.indented("Voetbal"),t=>t.state("m","smal")],
  hint1:"Selecteer Naam:, Klas: en Datum: samen en klik één keer op B.",hint2:"Opsommingstekens = bolletjes. Daarna inspringen = blauw pijltje naar rechts. Marges = Indeling › Marges › Smal."},
 {id:"L5e4",type:"editor",short:"Brief opruimen",title:"Ruim de brief op en maak hem netjes",
  html:"<p>Uitnodiging voor het schoolfeest</p><p><br></p><p><br></p><p>Beste leerlingen,</p><p>Op vrijdag 23 mei houden we ons groot schoolfeest. Er is muziek, een quiz en lekker eten.</p><p><br></p><p><br></p><p><br></p><p>Tot dan!</p><p>Het feestcomité</p>",
  steps:["Zet <b>¶ Alles weergeven</b> aan en verwijder alle <b>lege alinea's</b>.","Geef de titel het lettertype <b>Georgia</b>, grootte <b>16</b> en maak hem <b>vet</b>.","Markeer <b>vrijdag 23 mei</b> in het <b>geel</b>.","Kies de marges <b>Breed</b> en voeg een <b>paginarand</b> toe.","Alle tekst blijft staan."],
  checks:[t=>t.marks()&&t.noEmpty(),t=>t.style("Uitnodiging voor het schoolfeest",t.font("Georgia"))&&t.style("Uitnodiging voor het schoolfeest",t.size(16))&&t.style("Uitnodiging voor het schoolfeest",t.isBold),t=>t.style("vrijdag 23 mei",t.hl("#FFFF00")),t=>t.state("m","breed")&&t.state("border",true),t=>["Beste leerlingen","Op vrijdag","Tot dan!","Het feestcomité"].every(w=>t.has(w))],
  hint1:"Een lege alinea is een regel met alleen ¶. Klik erin en druk op Backspace.",hint2:"Markeren = stift (pijltje → Geel). Marges = Indeling. Paginarand = Ontwerpen."}
]},

{id:"L6",title:"Mix: affiches en folders",emoji:"🎨",intro:"Tabellen, afbeeldingen en pagina-indeling samen met tekstopmaak: je ontwerpt affiches, menu's en nieuwsbrieven.",mix:true,ex:[

 {id:"L6r2",type:"ribbon",short:"Watermerk",q:"Op elke pagina moet het woord <b>CONCEPT</b> schuin en licht op de achtergrond staan.",target:["ontwerpen.watermerk"],hint1:"Ook dit is een 'paginaachtergrond'.",hint2:"Tabblad <b>Ontwerpen</b> › <b>Watermerk</b>."},
 {id:"L6q1",type:"quiz",short:"Tekst naast foto",q:"Je afbeelding staat in je tekst en de tekst springt eronder. Je wil de tekst <b>naast</b> de afbeelding. Wat pas je aan?",opts:["De lettergrootte","De tekstterugloop (bv. Vierkant)","De marges","De regelafstand"],ok:1,hint1:"Het gaat over hoe tekst en afbeelding samen staan.",hint2:"Je leerde dit in level 3.",explain:"Met Tekstterugloop › Vierkant loopt de tekst rond de afbeelding."},

 {id:"L6e1",type:"editor",short:"Menukaart",title:"Maak een menukaart met een tabel",
  html:"<p>Menu van de week</p><p>Kies elke dag uit soep of een warme maaltijd.</p><p><br></p><p>Smakelijk!</p>",
  steps:["Geef de titel de stijl <b>Kop 1</b> en <b>centreer</b> hem.","Klik in de lege regel en voeg een tabel in met <b>2 kolommen en 4 rijen</b>.","Typ in rij 1 <b>Weekdag</b> en <b>Gerecht</b>, in rij 2 <b>Maandag</b> en <b>Spaghetti</b>.","Maak <b>Weekdag</b> en <b>Gerecht</b> vet.","<b>Centreer</b> 'Smakelijk!' en maak het <b>cursief</b>."],

    theme:"standaard",themes:["standaard"],badges:{},ex:{},streak:0,bestStreak:0,levelDone:{},levelExported:{},activeSec:0,exports:0};
}
function R(id){return P.ex[id]||(P.ex[id]={att:0,done:false,skip:false,hints:[],score:0});}

/* ============================================================
   SCORES
   ============================================================ */
function maxOf(e){return e.max||(e.type==="editor"?20:e.type==="extern"?CONFIG.EXTERN_MAX:5);}
function half(x){return Math.round(x*2)/2;}
function fmtP(x){return String(half(x)).replace(".",",");}
function penalty(e,h){return maxOf(e)*((h.includes(1)?CONFIG.HINT1_AFTREK:0)+(h.includes(2)?CONFIG.HINT2_AFTREK:0));}
function scoreFor(e,r){const a=CONFIG.PUNTEN[e.type];const base=a[Math.min(Math.max(r.att,1),a.length)-1]*maxOf(e)/a[0];return Math.max(0,half(base-penalty(e,r.hints||[])));}
function coinsFor(e,att){if(e.type==="editor")return att<=2?20:10;return att<=1?10:5;}
function exScore(e,r){if(!r||e.type==="extern")return 0;const s=r.done?Math.max(scoreFor(e,r),r.partial||0):r.skip?(r.partial||0):0;return Math.min(maxOf(e),half(s));}
function lvStats(L,p){
  p=p||P;let score=0,max=0,done=0,hand=0,hints=0,perfect=true,ext=null;
  L.ex.forEach(e=>{const r=p.ex[e.id]||{};if(e.type==="extern"){ext={ingediend:!!r.done,bestand:r.file||null};if(r.done)hand++;return;}
    max+=maxOf(e);score+=exScore(e,r);if(r.done){done++;if(r.att>1)perfect=false;}else perfect=false;if(r.done||r.skip)hand++;hints+=(r.hints||[]).length;});
  score=half(score);const total=L.ex.length;const pct=max?Math.round(score/max*100):0, finished=hand===total;
  const stars=!finished?0:pct>=90?3:pct>=75?2:pct>=50?1:0;
  return {score,max,done,hand,total,pct,finished,hints,perfect,stars,ext};
}
function totalXP(p){p=p||P;return half(LEVELS.reduce((a,L)=>a+lvStats(L,p).score,0));}
function rankOf(xp){let i=0;RANKS.forEach((r,k)=>{if(xp>=r[0])i=k;});return {i,name:RANKS[i][1],e:RANKS[i][2],cur:RANKS[i][0],next:RANKS[i+1]?RANKS[i+1][0]:null};}
function rankModal(){const xp=totalXP(),rk=rankOf(xp),max=LEVELS.reduce((a,L)=>a+lvStats(L).max,0);modal(`<h2>⭐ Rangen</h2><p>Met elke juiste oefening verdien je <b>XP</b> (je punten). Hoe meer XP, hoe hoger je rang. Je hebt nu <b>${fmtP(xp)} XP</b> (maximum ${max}).</p><div class="ranks">${RANKS.map((r,k)=>`<div class="rk ${k<rk.i?"done":k===rk.i?"now":""}"><span class="re">${r[2]}</span><span class="rn"><b>${esc(r[1])}</b><small>vanaf ${r[0]} XP</small></span><span class="rs">${k<rk.i?"✔ behaald":k===rk.i?"⭐ jij bent hier":"🔒 nog "+fmtP(r[0]-xp)+" XP"}</span></div>`).join("")}</div><br><button class="btn" data-close>Sluiten</button>`);}
function unlocked(idx){if(CONFIG.ALLE_LEVELS_OPEN||idx===0)return true;const prev=LEVELS[idx-1];return lvStats(prev).finished&&!!P.levelExported[prev.id];}

function flyCoins(n,el){const r=(el||$("#tCoins")).getBoundingClientRect();const d=document.createElement("div");d.className="coinfly";d.textContent=(n>0?"+":"")+n+" 🪙";d.style.left=(r.left)+"px";d.style.top=(r.top)+"px";document.body.appendChild(d);setTimeout(()=>d.remove(),1300);}
function confetti(){const cols=["#e91e63","#ffc107","#4caf50","#2196f3","#9c27b0","#ff5722"];for(let i=0;i<70;i++){const c=document.createElement("div");c.className="confetti";c.style.left=Math.random()*100+"vw";c.style.background=cols[i%cols.length];c.style.animationDelay=Math.random()*.8+"s";c.style.animationDuration=(1.8+Math.random()*1.4)+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),3600);}}

  modal('<div class="big">'+b.e+'</div><h2>Nieuwe badge: '+esc(b.n)+'</h2><p style="font-size:20px">'+T.e+' '+T.n+'</p><p>'+esc(b.d)+'</p><p><b>+'+T.m+' 🪙 bonus</b></p><button class="btn" data-close>Super!</button>');}});}save();updTop();}

function migrate(p){p.ex=p.ex||{};p.badges=p.badges||{};p.themes=p.themes||["standaard"];p.levelDone=p.levelDone||{};p.activeSec=p.activeSec||0;p.coinsEarned=p.coinsEarned||0;p.coinsSpent=p.coinsSpent||0;p.exports=p.exports||0;p.levelExported=p.levelExported||{};p.owned=p.owned||[...new Set(["standaard"].concat(p.themes||[]))];p.settings=p.settings||{lees:false,voorlees:true,trager:false,plak:false};p.theorySeen=p.theorySeen||{};}
$("#fileIn").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const j=JSON.parse(await f.text());if((j.app!==CONFIG.APP&&!CONFIG.APP_OUD.includes(j.app))||!j.data)throw 0;
    if(j.checksum!==checksum(j))toast("Let op: dit bestand werd aangepast. Je leerkracht ziet dit.");
    const p=j.data;migrate(p);const old=STORE.profiles[p.id];
    if(old&&old.savedAt>p.savedAt&&!confirm("Op deze computer staat een nieuwere voortgang voor "+p.naam+". Toch het bestand gebruiken?"))return;
    P=p;save();showWorlds();toast("Welkom terug, "+esc(p.naam.split(" ")[0])+"!");}
  catch(err){toast("Dit is geen geldig Office Avontuur-bestand.");}};

let curL=null,curI=0;
function openLevel(L,i){closeMenu();curEditor=null;curL=L;curI=i;const s=lvStats(L);const e=L.ex[i],r=R(e.id);if(!r.seen){r.seen=Date.now();save();}
  const typ={ribbon:"🔍 Zoek de knop",quiz:"❓ Quizvraag",keys:"⌨️ Sneltoets",editor:"✏️ Opdracht in Word",extern:"📎 Opdracht in het echte Word"};curEdT=null;stopKeys();
  app.innerHTML=`<div class="lvwrap ${P.settings.sideClosed?"collapsed":""}"><div class="side"><div class="sidetop"><button id="sideTog" title="Balk dichtschuiven / openschuiven">${P.settings.sideClosed?"▶":"◀"}</button><button class="btn sec" id="back" title="Alle levels">⬅<span class="lbl"> Alle levels</span></button></div><button class="btn ghost" id="sideTh" title="Theorie" style="width:100%;margin-bottom:10px;padding:8px">📖<span class="lbl"> Theorie</span></button><h3>${L.emoji} ${esc(L.title)}</h3>
   ${L.ex.map((x,k)=>{const rr=R(x.id);return `<div class="it ${k===i?"cur":""}" data-k="${k}" title="${esc(x.short)}"><span class="dot ${rr.done?"ok":rr.skip?"skip":""}">${rr.done?"✓":rr.skip?"»":k+1}</span><span class="lbl">${esc(x.short)} <span style="opacity:.7">${({ribbon:"🔍",quiz:"❓",keys:"⌨️",editor:"✏️",extern:"📎"})[x.type]}</span></span></div>`;}).join("")}
   <div class="sidepts" style="margin:12px 6px 0;font-size:14px;color:var(--muted)">${fmtP(s.score)}/${s.max} punten</div></div>
   <div class="panel" id="ex"><span class="qtype">${typ[e.type]} · ${e.type==="extern"?"punten door je leerkracht":maxOf(e)+" punten"}</span></div></div>`;
  $("#sideTog").onclick=()=>{P.settings.sideClosed=!P.settings.sideClosed;save();const w=app.querySelector(".lvwrap");w.classList.toggle("collapsed",P.settings.sideClosed);setTimeout(()=>window.dispatchEvent(new Event("resize")),250);$("#sideTog").textContent=P.settings.sideClosed?"▶":"◀";};
  $("#back").onclick=goHome;$("#sideTh").onclick=()=>renderTheory(L.id,()=>openLevel(L,i));app.querySelectorAll(".it").forEach(d=>d.onclick=()=>openLevel(L,+d.dataset.k));
  const box=$("#ex");
  if(e.type==="ribbon")renderRibbonEx(box,e,r);else if(e.type==="keys")renderKeys(box,e,r);else if(e.type==="quiz")renderQuiz(box,e,r);else if(e.type==="extern")renderExtern(box,e,r);else renderEditorEx(box,e,r);

function nextEx(){const L=curL;let k=-1;for(let j=1;j<=L.ex.length;j++){const n=(curI+j)%L.ex.length;const r=R(L.ex[n].id);if(!r.done&&!r.skip){k=n;break;}}
  if(k<0){for(let j=1;j<=L.ex.length;j++){const n=(curI+j)%L.ex.length;if(!R(L.ex[n].id).done){k=n;break;}}}
  if(k<0||lvStats(L).finished&&k<=curI){goHome();return;}openLevel(L,k);}
function navRow(e,r){return `<div class="navrow">${!r.done&&r.att>=CONFIG.OVERSLAAN_NA&&!r.skip?'<button class="btn ghost" id="skip">Sla over ⏭</button>':""}<button class="btn ${r.done?"":"sec"}" id="next">${r.done?"Volgende ▶":"Volgende oefening ▶"}</button></div>`;}
let curEdT=null;
function bindNav(e,r){const n=$("#next");if(n)n.onclick=nextEx;const s=$("#skip");if(s)s.onclick=()=>{
  if(e.type==="editor"&&curEdT){const ok=e.checks.filter(c=>{try{return !!c(curEdT);}catch(err){return false;}}).length;r.partial=Math.max(r.partial||0,half(maxOf(e)*CONFIG.OVERSLAAN_DEELPUNTEN*ok/e.checks.length));
    if(r.partial)toast("Je krijgt "+fmtP(r.partial)+" punt(en) voor de stappen die al juist waren.");}
  r.skip=true;r.wasSkipped=true;P.streak=0;save();afterChange();nextEx();};}
function hintHTML(e,r){if(r.done)return "";const has1=r.hints.includes(1),has2=r.hints.includes(2);
  return `<div class="hints"><span class="lbl">Hulp nodig?</span>
   ${has1?"":`<button class="btn sec" data-h="1" ${P.coins<CONFIG.HINT1_PRIJS?"disabled":""}>💡 Tip kopen (${CONFIG.HINT1_PRIJS} 🪙 · −${fmtP(maxOf(e)*CONFIG.HINT1_AFTREK)} pt)</button>`}
   ${has2?"":`<button class="btn sec" data-h="2" ${P.coins<CONFIG.HINT2_PRIJS?"disabled":""}>🔦 Grote hint kopen (${CONFIG.HINT2_PRIJS} 🪙 · −${fmtP(maxOf(e)*CONFIG.HINT2_AFTREK)} pt)</button>`}
   ${P.coins<CONFIG.HINT1_PRIJS&&!(has1&&has2)?'<span style="color:var(--muted);font-size:14px">Te weinig munten. Verdien er meer met andere oefeningen!</span>':""}</div>
   ${has1?`<div class="hintbox">💡 ${e.hint1} ${sayBtn(e.hint1)}</div>`:""}${has2?`<div class="hintbox">🔦 ${e.hint2} ${sayBtn(e.hint2)}</div>`:""}
   <div style="margin-top:8px"><button class="btn ghost" data-theory="1" style="padding:6px 12px">📖 Bekijk de theorie (gratis)</button></div>`;}
function bindHints(e,r,rerender){document.querySelectorAll("[data-theory]").forEach(b=>b.onclick=()=>{const L=curL,i=curI;renderTheory(L.id,()=>openLevel(L,i));});document.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{const h=+b.dataset.h,pr=h===1?CONFIG.HINT1_PRIJS:CONFIG.HINT2_PRIJS;if(P.coins<pr)return;
  addCoins(-pr,b);r.hints.push(h);save();rerender();});}
function succeed(e,r){r.att++;if(r.skip)r.wasSkipped=true;r.done=true;r.skip=false;r.doneAt=Date.now();r.score=exScore(e,r);fxBurst();mascotSay(true);
  if(r.att===1||(e.type==="editor"&&r.att<=2)){P.streak++;P.bestStreak=Math.max(P.bestStreak,P.streak);}else P.streak=0;
  const c=coinsFor(e,r.att);save();addCoins(c,$("#ex"));afterChange();}
function fail(r){r.att++;P.streak=0;save();mascotSay(false);}
function afterChange(){checkBadges();const L=curL,s=lvStats(L);
  if(s.finished&&!P.levelDone[L.id]){P.levelDone[L.id]=Date.now();P.coins+=25;P.coinsEarned+=25;save();updTop();confetti();
    modal(`<div class="big">${s.stars?"⭐".repeat(s.stars):"🎉"}</div><h2>Level afgewerkt: ${esc(L.title)}</h2><p>Je scoorde <b>${fmtP(s.score)} op ${s.max}</b> (${s.pct}%)${s.ext?" + je Word-opdracht (punten door je leerkracht)":""}.</p>
    <p><b>+25 🪙 levelbonus</b></p>${s.done<s.total?`<p style="color:var(--muted)">Je sloeg ${s.total-s.done} oefening(en) over. Je kan ze later nog maken voor extra punten.</p>`:""}
    <p><b>Nu nog je punten inleveren op Teams.</b>${LEVELS.indexOf(L)<LEVELS.length-1?" Daarna gaat level "+(LEVELS.indexOf(L)+2)+" open.":""}</p><button class="btn" data-close>📤 Punten inleveren</button>`,()=>exportLevelModal(L));}
  checkBadges();updTop();}

/* ---- Zoek de knop ---- */
function renderRibbonEx(box,e,r){
  const head=box.querySelector(".qtype").outerHTML;
  box.innerHTML=head+`<h2>${e.q} ${sayBtn(e.q)}</h2>${r.done?`<div class="fb ok">✔ Juist! <b>${esc(BTN[e.target[0]].label)}</b> ${BTN[e.target[0]].titel?"staat bovenaan in de <b>blauwe titelbalk</b> van Word.":`staat op het tabblad <b>${esc(BTN[e.target[0]].tab)}</b>, in de groep <b>${esc(BTN[e.target[0]].group)}</b>.`} (${fmtP(exScore(e,r))}/${maxOf(e)} punten)</div>`:`<p style="color:var(--muted)">Klik op een tabblad om het te openen. Wijs een knop aan om zijn naam te zien.</p>`}
   <div id="fb"></div><div id="rb"></div>${hintHTML(e,r)}${navRow(e,r)}`;
  const tgtTab=e.target[0].split(".")[0];
  const rib=buildRibbon($("#rb"),{mode:"find",pulseTab:r.hints.includes(2)&&!r.done?tgtTab:null,onBtn:(id,el)=>{
    if(r.done){toast("Deze oefening heb je al juist. 👍");return;}
    if(e.target.includes(id)){el.classList.add("flash-ok");succeed(e,r);setTimeout(()=>renderRibbonEx(box,e,r),450);}
    else{el.classList.remove("flash-bad");void el.offsetWidth;el.classList.add("flash-bad");fail(r);
      $("#fb").innerHTML=`<div class="fb bad">✘ Dat is <b>${esc(BTN[id]?BTN[id].label:id)}</b>. Probeer opnieuw!</div>`;
      if(r.att===CONFIG.OVERSLAAN_NA&&!box.querySelector("#skip")){box.querySelector(".navrow").insertAdjacentHTML("afterbegin",'<button class="btn ghost" id="skip">Sla over ⏭</button>');bindNav(e,r);}}
  }});
  bindHints(e,r,()=>renderRibbonEx(box,e,r));bindNav(e,r);
}
/* ---- Sneltoets ---- */
let keyH=null,pendCtrl=0;
function stopKeys(){if(keyH){document.removeEventListener("keydown",keyH,true);keyH=null;}}
function comboOf(ev){if(["Control","Shift","Alt","Meta","AltGraph","CapsLock","Tab"].includes(ev.key))return null;
  const k=ev.key.length===1?ev.key.toUpperCase():ev.key;return (ev.ctrlKey||ev.metaKey?"Ctrl+":"")+(ev.shiftKey?"Shift+":"")+(ev.altKey?"Alt+":"")+k;}
function renderKeys(box,e,r){
  const head=box.querySelector(".qtype").outerHTML;stopKeys();
  box.innerHTML=head+`<h2>${e.q} ${sayBtn(e.q)}</h2>
   <div id="kb" style="margin:14px 0;border:3px dashed var(--acc2);border-radius:16px;padding:26px;text-align:center;background:var(--accl)">
    <div style="font-size:44px">⌨️</div><div id="kshow" style="font-size:26px;font-weight:800;min-height:34px;margin-top:6px">${r.done?esc(e.combo.replace("+"," + ")):"Druk nu op de toetsen …"}</div>
    <div style="color:var(--muted);font-size:14px;margin-top:6px">${r.done?"":"Houd de eerste toets ingedrukt en druk dan op de tweede."}</div></div>
   <div id="fb">${r.done?`<div class="fb ok">✔ Juist! ${esc(e.combo.replace("+"," + "))} (${fmtP(exScore(e,r))}/${maxOf(e)} punten)</div>`:""}</div>${hintHTML(e,r)}${navRow(e,r)}`;
  if(!r.done){keyH=ev=>{if($("#ov")&&!$("#ov").classList.contains("hidden"))return;if(P.settings.plak&&(ev.key==="Control"||ev.key==="Meta")){pendCtrl=Date.now();$("#kshow").textContent="Ctrl + …";return;}
      let c=comboOf(ev);if(!c)return;let mod=ev.ctrlKey||ev.metaKey||ev.altKey||/^F\d{1,2}$/.test(ev.key);if(!mod&&P.settings.plak&&pendCtrl&&Date.now()-pendCtrl<3000&&ev.key.length===1){c="Ctrl+"+ev.key.toUpperCase();mod=true;}pendCtrl=0;if(mod)ev.preventDefault();
      $("#kshow").textContent=c.replace(/\+/g," + ");
      if(!mod){$("#fb").innerHTML='<div class="fb info">Bijna: een sneltoets begint met een toets die je <b>ingedrukt houdt</b>, zoals Ctrl.</div>';return;}
      if(c===e.combo){stopKeys();succeed(e,r);renderKeys(box,e,r);}
      else{fail(r);$("#fb").innerHTML=`<div class="fb bad">✘ Je drukte <b>${esc(c.replace(/\+/g," + "))}</b>. Dat is niet juist. Probeer opnieuw!</div>`;
        if(r.att===CONFIG.OVERSLAAN_NA&&!box.querySelector("#skip")){box.querySelector(".navrow").insertAdjacentHTML("afterbegin",'<button class="btn ghost" id="skip">Sla over ⏭</button>');bindNav(e,r);}}};
    document.addEventListener("keydown",keyH,true);}
  bindHints(e,r,()=>renderKeys(box,e,r));bindNav(e,r);
}
/* ---- Quiz ---- */

   <div id="fb">${r.done?`<div class="fb ok">✔ Juist! ${esc(e.explain)} (${fmtP(exScore(e,r))}/${maxOf(e)} punten)</div>`:""}</div>${hintHTML(e,r)}${navRow(e,r)}`;

  bindHints(e,r,()=>renderQuiz(box,e,r));bindNav(e,r);

   <div id="fb">${r.done?`<div class="fb ok">✔ Opdracht geslaagd! (${fmtP(exScore(e,r))}/${maxOf(e)} punten). Je mag hier nog verder oefenen, maar je punten blijven dezelfde.</div>`:""}</div>
   <div class="navrow edact"><button class="btn ghost" id="reset" title="Opnieuw beginnen">↺</button><button class="btn" id="check" style="flex:1">✔ Controleer mijn werk</button></div>

  $("#check").onclick=()=>{const res=e.checks.map(c=>{try{return !!c(ed.T);}catch(err){return false;}});
    const lis=box.querySelectorAll("#steps li");const map=e.stepCheck||e.checks.map((_,k)=>k);
    lis.forEach((li,k)=>{li.className="";const c=map[k];if(c===null||c===undefined)return;li.className=res[c]?"ok":"bad";});
    if(res.every(Boolean)){if(r.done){$("#fb").innerHTML='<div class="fb ok">✔ Nog steeds perfect! 👍</div>';return;}
      succeed(e,r);const snap=ed.snapshot();renderEditorEx(box,e,r,snap);box.querySelectorAll("#steps li").forEach((li,k)=>{if(map[k]!=null)li.className="ok";});confetti();}
    else{if(!r.done){fail(r);}const n=res.filter(x=>!x).length;
      $("#fb").innerHTML=`<div class="fb bad">✘ Nog ${n} ${n===1?"punt is":"punten zijn"} niet in orde. Kijk naar de rode kruisjes en probeer opnieuw.</div>`;
      if(!r.done&&r.att>=CONFIG.OVERSLAAN_NA&&!box.querySelector("#skip")){box.querySelectorAll(".navrow")[1].insertAdjacentHTML("afterbegin",'<button class="btn ghost" id="skip">Sla over ⏭</button>');bindNav(e,r);}}};
  bindHints(e,r,()=>renderEditorEx(box,e,r,ed.snapshot()));bindNav(e,r);

function buildRibbon(host,opt){
  let tab=opt.tab||"start";let ctx=false;
  const ini=(P&&P.naam?P.naam:"?").split(" ").map(x=>x[0]||"").join("").slice(0,2).toUpperCase();
  host.innerHTML=`<div class="wapp"><div class="wtitle"><div class="wtl"><span class="wlogo">W</span><button class="as" data-id="titel.autosave" title="Automatisch opslaan"><span class="ast">Automatisch opslaan</span><span class="wsw on"><i></i></span><span class="swt">Aan</span></button>
   <button class="qa" data-id="titel.opslaan" title="Opslaan (Ctrl+S)">${svg("saveW")}</button><button class="qa" data-id="titel.ongedaan" title="Ongedaan maken (Ctrl+Z)">↶</button><button class="qa" data-id="titel.opnieuw" title="Opnieuw (Ctrl+Y)">↷</button></div>
   <button class="fname" data-id="titel.bestandsnaam" title="Klik om de bestandsnaam te wijzigen"><span class="fn">${esc(opt.fname||"Document1")}</span><span class="fst"> • Opgeslagen ✓</span><span class="fdd">⌄</span></button>
   <button class="wsearch" data-id="titel.zoeken" title="Zoeken (Alt+Q)">🔍 Zoeken (Alt+Q)</button>
   <div class="wtr"><span class="wav" title="${esc(P?P.naam:"")}">${esc(ini)}</span><span class="wc3">—</span><span class="wc3">☐</span><span class="wc3">✕</span></div></div><div class="wtabs"></div><div class="wribbon"></div>${opt.after||""}</div>`;
  const tabsEl=host.querySelector(".wtabs"),ribEl=host.querySelector(".wribbon");
  function bHTML(t,b,kind){const id=t+"."+b.id,tip=esc(b.tip||b.label);
    if(b.sel){ if(opt.mode==="edit"){const list=b.sel==="font"?FONTS:SIZES;return `<select class="rb-sel" data-id="${id}" title="${tip}" style="width:${b.w}px">${list.map(v=>`<option${v===(b.sel==="font"?"Aptos":12)?" selected":""}>${v}</option>`).join("")}</select>`;}
      return `<button class="fsel rb" data-id="${id}" title="${tip}" style="width:${b.w}px"><span>${b.sel==="font"?"Aptos (Hoofdtekst)":"12"}</span><span class="dd">▼</span></button>`;}
    const ic=b.icon?svg(b.icon):`<span class="g">${b.g}</span>`;
    if(kind==="L")return `<button class="rb L" data-id="${id}" title="${tip}">${ic}<span>${esc(b.label)}${b.dd?" ▾":""}</span></button>`;
    if(kind==="SL")return `<button class="rb SL" data-id="${id}" title="${tip}">${ic}<span>${esc(b.label)}${b.dd?" ▾":""}</span></button>`;
    return `<button class="rb S" data-id="${id}" title="${tip}">${ic}${b.dd?'<span class="dd">▼</span>':""}</button>`;}
  function render(){
    tabsEl.innerHTML=RIBBON.filter(t=>!t.ctx||ctx).map(t=>`<button class="wtab ${t.file?"file":""} ${t.ctx?"ctx":""} ${t.id===tab?"on":""} ${opt.pulseTab===t.id&&t.id!==tab?"pulse":""}" data-tab="${t.id}">${t.name}</button>`).join("")
      +`<span class="tsp"></span><button class="wtab2" data-id="titel.opmerkingen" title="Opmerkingen">💬<span class="lbl2"> Opmerkingen</span></button><button class="wshare" data-id="titel.delen" title="Delen">↗ Delen</button>`;
    const T=RIBBON.find(t=>t.id===tab);
    ribEl.innerHTML=T.groups.map(g=>`<div class="wgrp${g.opt?" opt":""}"><div class="gi">${g.items.map(it=>{
      if(it.L)return bHTML(T.id,it.L,"L");
      if(it.rows)return `<div class="rows">${it.rows.map(row=>`<div class="r">${row.map(b=>bHTML(T.id,b,"S")).join("")}</div>`).join("")}</div>`;
      if(it.col)return `<div class="col">${it.col.map(b=>bHTML(T.id,b,"SL")).join("")}</div>`;
      if(it.styles)return `<div class="stylebox">${it.styles.map(b=>`<button class="rb" data-id="${T.id}.${b.id}" title="${esc(b.label)}">${b.p}</button>`).join("")}</div>`;
      return "";}).join("")}</div><div class="gn">${esc(g.name)}${g.dlg?`<button class="dlg" data-id="${T.id}.dlg_${g.name.toLowerCase().replace(/[^a-z]/g,"")}" title="Meer opties voor ${esc(g.name)}"><svg viewBox="0 0 10 10" width="9" height="9"><path d="M1 1h6M1 1v6M4 4l5 5M9 5v4H5" stroke="#555" fill="none" stroke-width="1.2"/></svg></button>`:""}</div></div>`).join("");
    if(opt.onRender)opt.onRender(ribEl);fit();
  }
  const wappEl=host.querySelector(".wapp");
  function fit(){["c1","c2","c3","c4"].forEach(c=>wappEl.classList.remove(c));for(const c of ["c1","c2","c3","c4"]){if(ribEl.scrollWidth<=ribEl.clientWidth+1)break;wappEl.classList.add(c);}}
  window.addEventListener("resize",()=>{if(document.body.contains(wappEl))fit();});
  tabsEl.addEventListener("mousedown",ev=>ev.preventDefault());
  tabsEl.addEventListener("click",ev=>{const x=ev.target.closest("[data-id]");if(x){opt.onBtn(x.dataset.id,x,ev);return;}const b=ev.target.closest("[data-tab]");if(!b)return;tab=b.dataset.tab;closeMenu();render();});
  const titleEl=host.querySelector(".wtitle");titleEl.addEventListener("mousedown",ev=>{if(ev.target.closest("[data-id]"))ev.preventDefault();});
  titleEl.addEventListener("click",ev=>{const b=ev.target.closest("[data-id]");if(b)opt.onBtn(b.dataset.id,b,ev);});
  ribEl.addEventListener("mousedown",ev=>{const b=ev.target.closest("button[data-id]");if(b)ev.preventDefault();});
  ribEl.addEventListener("click",ev=>{const b=ev.target.closest("button[data-id]");if(!b)return;opt.onBtn(b.dataset.id,b,ev);});
  ribEl.addEventListener("change",ev=>{const s=ev.target.closest("select[data-id]");if(s)opt.onBtn(s.dataset.id,s,ev);});
  render();
  return {setFile(name,auto,saved){host.querySelector(".fn").textContent=name;host.querySelector(".fst").textContent=auto?" • Opgeslagen ✓":saved?" • Opgeslagen":" • Niet opgeslagen";
      host.querySelector(".wsw").classList.toggle("on",!!auto);host.querySelector(".swt").textContent=auto?"Aan":"Uit";},
    setCtx(v){if(ctx===v)return;ctx=v;if(v)tab="afbeelding";else if(tab==="afbeelding")tab="start";render();},get tab(){return tab;},render,setTab(t){tab=t;render();}};
}

let curEditor=null,menuEl=null;
function closeMenu(){if(menuEl){menuEl.remove();menuEl=null;}}
document.addEventListener("mousedown",ev=>{if(menuEl&&!menuEl.contains(ev.target)&&!ev.target.closest("[data-id]"))closeMenu();});
function openMenu(anchor,html,bind){closeMenu();const m=document.createElement("div");m.className="menu";m.innerHTML=html;document.body.appendChild(m);
  const r=anchor.getBoundingClientRect();m.style.left=Math.min(r.left,innerWidth-m.offsetWidth-8)+"px";m.style.top=(r.bottom+2)+"px";
  m.addEventListener("mousedown",ev=>{if(!ev.target.closest("input,select,textarea"))ev.preventDefault();});menuEl=m;bind(m);}
function hex2rgb(h){h=h.replace("#","");const n=parseInt(h,16);return `rgb(${n>>16&255}, ${n>>8&255}, ${n&255})`;}

function mountEditor(host,e,snap){
  const st=snap?JSON.parse(JSON.stringify(snap.state)):{or:"staand",m:"normaal",border:false,color:"",hdrOn:false,ftrOn:false,fname:e.fname||"Document1",autosave:e.autosave!==false,saved:true};
  let rib;
  host.innerHTML="";
  rib=buildRibbon(host,{mode:"edit",fname:st.fname,onBtn:act,
    after:`<div class="wdoc"><div class="page"><div class="hdr"></div><div class="wbody" contenteditable="true" spellcheck="false"></div><div class="ftr"></div></div></div><div class="wstatus"><span>Pagina 1 van 1</span><span class="wc"></span><span>Nederlands (België)</span><span>♿ Toegankelijkheid: alles in orde</span><span class="wsp"></span><span>🎯 Focus</span><span>▤ ▢ ▭</span><span>− <i class="zl"><b></b></i> + 100%</span></div>`});
  const page=host.querySelector(".page"),body=host.querySelector(".wbody"),hdr=host.querySelector(".hdr"),ftr=host.querySelector(".ftr"),wapp=host.querySelector(".wapp");
  body.innerHTML=snap?snap.body:e.html;if(snap){hdr.innerHTML=snap.hdr;ftr.innerHTML=snap.ftr;}
  let lastRange=null,selImg=null;
  try{document.execCommand("styleWithCSS",false,false);document.execCommand("defaultParagraphSeparator",false,"p");}catch(err){}
  function applyState(){page.dataset.or=st.or;page.dataset.m=st.m;page.dataset.border=st.border?"1":"0";page.style.background=st.color||"#fff";
    [["hdrOn",hdr],["ftrOn",ftr]].forEach(([k,el])=>{el.contentEditable=st[k]?"true":"false";el.classList.toggle("active",!!st[k]);});}
  applyState();
  function upd(){rib.setFile(st.fname,st.autosave,st.saved);}upd();
  function dirty(){if(!st.autosave&&st.saved){st.saved=false;upd();}}
  [body,hdr,ftr].forEach(x=>x.addEventListener("input",dirty));
  function doSave(){if(st.autosave){toast("Je werk wordt al automatisch opgeslagen op OneDrive ✓");return;}st.saved=true;upd();toast("Opgeslagen ✓ ("+esc(st.fname)+".docx)");}
  function renameMenu(anchor,asDialog){openMenu(anchor,`<div class="ren"><div class="mh">${asDialog?"Opslaan als":"Bestandsnaam"}</div><input id="renIn" value="${esc(st.fname)}" spellcheck="false" autocomplete="off"><div class="renerr"></div><div class="renloc">📁 Locatie: OneDrive - School › Documenten</div><div class="renbtns"><button class="btn" id="renOk">${asDialog?"Opslaan":"OK"}</button></div></div>`,m=>{
    const i=m.querySelector("#renIn"),er=m.querySelector(".renerr");setTimeout(()=>{i.focus();i.select();},0);

     <p>${it.uitleg}</p>${it.stappen?`<ol>${it.stappen.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>`:""}${it.tip?`<p class="tiptxt">💡 ${it.tip}</p>`:""}</div></div>`).join("")}</div>`;}
  app.innerHTML=`<div class="theory"><div class="navrow" style="justify-content:space-between;margin:0 0 12px"><button class="btn sec" id="thBack">⬅ Terug</button><button class="btn ghost" id="thPrint">🖨️ Afdrukken</button></div>

  const vs=speechSynthesis.getVoices();const v=vs.find(v=>/^nl-BE/i.test(v.lang))||vs.find(v=>/^nl/i.test(v.lang));if(v)u.voice=v;u.rate=(P&&P.settings&&P.settings.trager)?0.75:0.95;speechSynthesis.speak(u);}

function shopModal(cat){cat=cat||"thema";modal(`<h2>🛍️ Winkel</h2><p>Je hebt <b>${P.coins} 🪙</b>. Tip: munten heb je ook nodig voor hints. Spaar slim!</p>

   return `<div class="itm ${i.top?"top":""}">${prev}<b>${esc(i.n)}</b>${i.d?`<small>${esc(i.d)}</small>`:""}${!own&&P.coins<i.prijs?`<small>Nog ${i.prijs-P.coins} 🪙 sparen</small>`:""}${btn}</div>`;}).join("")}</div>

/* controlegetal (zelfde berekening in het lerarendashboard) */
function cyrb53(str,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);}
function checksum(j){return cyrb53(JSON.stringify(j.data)+"|"+JSON.stringify(j.summary)+"|"+CONFIG.SALT);}
function buildExport(levelId){
  const summary={xp:totalXP(),rang:rankOf(totalXP()).name,munten:P.coins,muntenVerdiend:P.coinsEarned,muntenUitgegeven:P.coinsSpent,badges:Object.keys(P.badges),actieveMinuten:Math.round(P.activeSec/60),
    puntenregels:{punten:CONFIG.PUNTEN,hint1:CONFIG.HINT1_AFTREK,hint2:CONFIG.HINT2_AFTREK,externMax:CONFIG.EXTERN_MAX},
    ingeleverd:P.levelExported,instellingen:P.settings,
    levels:LEVELS.map(L=>{const s=lvStats(L);return {id:L.id,titel:L.title,score:s.score,max:s.max,pct:s.pct,gedaan:s.done,overgeslagen:s.hand-s.done-(s.ext&&s.ext.ingediend?1:0),totaal:s.total,hints:s.hints,afgewerkt:s.finished,sterren:s.stars,
      extern:s.ext?{ingediend:s.ext.ingediend,bestand:s.ext.bestand,max:CONFIG.EXTERN_MAX}:null};}),
    oefeningen:LEVELS.flatMap(L=>L.ex.map(e=>{const r=P.ex[e.id]||{};return {id:e.id,level:L.id,type:e.type,naam:e.short,status:r.done?(e.type==="extern"?"ingediend":"juist"):r.skip?"overgeslagen":(r.att?"bezig":"niet gemaakt"),pogingen:r.att||0,score:e.type==="extern"?null:exScore(e,r),max:maxOf(e),hints:(r.hints||[]).length};}))};
  const j={app:CONFIG.APP,wereld:"word",version:2,naam:P.naam,klas:P.klas,levelExport:levelId||null,exportedAt:new Date().toISOString(),summary,data:P};
  j.checksum=checksum(j);return j;}

    catch(e){const c=e&&e.code;if(c==="declined"){toast("Download geannuleerd. Probeer opnieuw als je het bestand wil.");return false;}
      if(c==="rate_limited"){toast("Even geduld, en klik dan opnieuw op Download.");return false;}
      toast("Downloaden lukt hier niet. Vraag je leerkracht om hulp.");return false;}}
  const blob=new Blob([text],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);return true;}
async function download(levelId){P.exports++;save();const j=buildExport(levelId);const name=fileBase(levelId)+".json";return (await saveFile(name,JSON.stringify(j)))?name:null;}

/* ============================================================
   EXTERNE WORD-OPDRACHT (.docx inlezen in de browser)
   ============================================================ */
async function readZip(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf);let eo=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-66000);i--){if(dv.getUint32(i,true)===0x06054b50){eo=i;break;}}
  if(eo<0)throw new Error("geen zip");
  const cnt=dv.getUint16(eo+10,true);let o=dv.getUint32(eo+16,true);const files={};const dec=new TextDecoder();
  for(let k=0;k<cnt;k++){if(dv.getUint32(o,true)!==0x02014b50)break;const meth=dv.getUint16(o+10,true),csz=dv.getUint32(o+20,true),nl=dv.getUint16(o+28,true),el=dv.getUint16(o+30,true),cl=dv.getUint16(o+32,true),lo=dv.getUint32(o+42,true);
    const name=dec.decode(u8.subarray(o+46,o+46+nl));files[name]={meth,csz,lo};o+=46+nl+el+cl;}
  async function text(name){const f=files[name];if(!f)return null;const ln=dv.getUint16(f.lo+26,true),le=dv.getUint16(f.lo+28,true);const data=u8.subarray(f.lo+30+ln+le,f.lo+30+ln+le+f.csz);
    if(f.meth===0)return dec.decode(data);if(f.meth!==8)return null;
    return await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();}
  return {names:Object.keys(files),text};
}
async function readDocx(file){
  const z=await readZip(await file.arrayBuffer());const xml=await z.text("word/document.xml");if(!xml)throw new Error("geen Word-bestand");
  const P_=s=>new DOMParser().parseFromString(s,"application/xml");const doc=P_(xml);
  const core=P_((await z.text("docProps/core.xml"))||"<x/>"),app=P_((await z.text("docProps/app.xml"))||"<x/>");
  const tg=(d,n)=>{const e=d.getElementsByTagName(n)[0];return e?e.textContent:"";};
  const hf=[];for(const n of z.names.filter(n=>/^word\/(header|footer)\d*\.xml$/.test(n)))hf.push({n,x:await z.text(n)});
  const paras=[...doc.getElementsByTagName("w:p")];
  const runs=[...doc.getElementsByTagName("w:r")].map(r=>{const pr=r.getElementsByTagName("w:rPr")[0];const on=t=>{const e=pr&&pr.getElementsByTagName(t)[0];return !!e&&!["0","false","none"].includes(e.getAttribute("w:val"));};
    return {t:[...r.getElementsByTagName("w:t")].map(x=>x.textContent).join(""),b:on("w:b"),i:on("w:i"),u:on("w:u")};});
  const runHas=(k,txt)=>runs.filter(r=>r[k]).map(r=>r.t).join("").toLowerCase().includes(txt.toLowerCase());
  const text=paras.map(p=>[...p.getElementsByTagName("w:t")].map(x=>x.textContent).join("")).join("\n");
  const tables=[...doc.getElementsByTagName("w:tbl")].map(t=>{const rows=[...t.getElementsByTagName("w:tr")];return {rows:rows.length,cols:rows[0]?rows[0].getElementsByTagName("w:tc").length:0};});
  const pg=doc.getElementsByTagName("w:pgSz")[0];
  const hfText=hf.filter(h=>h.n.includes("header")).map(h=>[...P_(h.x).getElementsByTagName("w:t")].map(t=>t.textContent).join("")).join(" ");
  const numIds=paras.map(p=>{const n=p.getElementsByTagName("w:numId")[0];return n?n.getAttribute("w:val"):null;}).filter(Boolean);
  const d={text,words:(text.match(/\S+/g)||[]).length,tables:tables.length,images:doc.getElementsByTagName("w:drawing").length+doc.getElementsByTagName("w:pict").length,
    landscape:!!pg&&(pg.getAttribute("w:orient")==="landscape"||+pg.getAttribute("w:w")>+pg.getAttribute("w:h")),
    pageNumber:hf.some(h=>/PAGE/.test(h.x)),listItems:numIds.length,
    has:t=>text.toLowerCase().includes(t.toLowerCase()),bold:t=>runHas("b",t),italic:t=>runHas("i",t),underline:t=>runHas("u",t),
    table:(c,r)=>tables.some(t=>t.cols===c&&t.rows===r),headerHas:t=>hfText.toLowerCase().includes(t.toLowerCase()),
    meta:{auteur:tg(core,"dc:creator"),laatstGewijzigdDoor:tg(core,"cp:lastModifiedBy"),gemaakt:tg(core,"dcterms:created"),gewijzigd:tg(core,"dcterms:modified"),bewerkingstijdMin:+tg(app,"TotalTime")||0,revisie:+tg(core,"cp:revision")||0}};
  d.bullets=d.numbering=d.listItems>0;return d;
}
function renderExtern(box,e,r){
  const head=box.querySelector(".qtype").outerHTML;const L=EX[e.id].L,n=LEVELS.indexOf(L)+1,f=r.file;
  box.innerHTML=head+`<h2>${esc(e.title)}</h2><div class="instr" style="padding-left:16px">${e.opdracht}</div>
   <div class="instr" style="padding-left:16px;background:#fff8e1;color:#6d4c00"><b>Zo werk je:</b><ol style="margin:6px 0 0;padding-left:20px">
    <li>Maak de opdracht in het <b>echte Word</b> en <b>sla je bestand op</b>.</li><li>Klik hieronder op <b>Kies mijn Word-bestand</b> en kies het bestand dat je maakte.</li>
    <li>Lever het daarna samen met je puntenbestand in op Teams, in de opdracht <b>«${esc(CONFIG.TEAMS_OPDRACHT.replace("{n}",n))}»</b>.</li></ol></div>
   <div id="fb">${f?`<div class="fb ok">✔ Je Word-bestand <b>${esc(f.name)}</b> is gekozen (${f.words} woorden). Je leerkracht geeft hiervoor de punten (op ${CONFIG.EXTERN_MAX}).</div>`:""}</div>
   ${f&&f.checks&&f.checks.length?`<ol class="instr">${f.checks.map(c=>`<li class="${c.ok?"ok":"bad"}">${esc(c.label)}</li>`).join("")}</ol><p style="color:var(--muted);font-size:14px">Dit is een eerste controle. Iets niet in orde? Pas je bestand aan in Word, sla op en kies het opnieuw.</p>`:""}
   <div class="navrow" style="justify-content:flex-start"><button class="btn" id="pick">📂 ${f?"Kies een nieuwere versie":"Kies mijn Word-bestand"}</button><input type="file" id="docIn" accept=".docx" class="hidden"></div>
   ${navRow(e,r)}`;
  $("#pick").onclick=()=>$("#docIn").click();
  $("#docIn").onchange=async ev=>{const file=ev.target.files[0];if(!file)return;
    if(!/\.docx$/i.test(file.name)){toast("Kies een Word-bestand (.docx).");return;}
    try{const d=await readDocx(file);if(d.words<1){toast("Dit Word-bestand is leeg.");return;}
      const checks=(e.checks||[]).map(c=>{let ok=false;try{ok=!!c.t(d);}catch(err){}return {label:c.label,ok};});
      const first=!r.done;r.file={name:file.name,grootte:file.size,words:d.words,gekozen:new Date().toISOString(),meta:d.meta,checks};r.done=true;r.att=1;r.doneAt=Date.now();r.score=null;
      save();if(first){addCoins(15,$("#ex"));afterChange();}renderExtern(box,e,r);}
    catch(err){toast("Dit bestand kan ik niet openen. Is het een Word-bestand (.docx) dat je opsloeg?");}};
  bindNav(e,r);
}
